<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dusza Műhely</title>
<style>
  :root {
    --bg: #faf7f2;
    --text: #2b2b2b;
    --accent: #a15c38;
  }

  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }

  body {
    font-family: 'Segoe UI', Verdana, sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.6;
  }

  header {
    padding: 4rem 1.5rem 2rem;
    text-align: center;
  }

  header h1 {
    font-size: 2.5rem;
    letter-spacing: 0.02em;
    color: var(--accent);
  }

  header p {
    margin-top: 0.5rem;
    font-size: 1.1rem;
    color: #555;
  }

  main {
    max-width: 700px;
    margin: 0 auto;
    padding: 2rem 1.5rem 4rem;
  }

  section {
    margin-bottom: 2.5rem;
  }

  section h2 {
    color: var(--accent);
    margin-bottom: 0.75rem;
    font-size: 1.4rem;
  }

  footer {
    text-align: center;
    padding: 1.5rem;
    font-size: 0.9rem;
    color: #888;
    border-top: 1px solid #e5ded4;
  }
</style>
</head>
<body>

  <header>
    <h1>Dusza Műhely</h1>
    <p>Ez az oldal épül – nézz vissza hamarosan.</p>
  </header>

  <main>
    <section>
      <h2>Rólunk</h2>
      <p>Itt lesz majd a Dusza Műhely bemutatása. Ezt a szöveget bármikor lecserélheted a saját tartalmadra.</p>
    </section>

    <section>
      <h2>Kapcsolat</h2>
      <p>Elérhetőség hamarosan.</p>
    </section>
  </main>

  <footer>
    &copy; 2026 Dusza Műhely
  </footer>

</body>
</html>
