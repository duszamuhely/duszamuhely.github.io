title: Dusza Műhely
url: "https://duszamuhely.hu"   # a megosztási kép teljes címéhez kell
description: Dusza Árpád Programozóműhely – középiskolás csapatok projektmunkája iparban dolgozó mentorokkal

# Jelentkezési űrlap linkje. Ha meg van adva, minden Jelentkezés gomb új lapon ezt nyitja meg.
# Ha üresre állítod (""), a gombok a "hamarosan nyílik" felugró ablakot mutatják.
jelentkezes_url: "https://forms.gle/x9vFBFUhAXGXprVy9"

# A főoldali számok sávjában mutatott mentorszám (az eddigi összes mentor).
# A Mentorok oldalon csak az aktuális mentorok szerepelnek.
mentorok_szama: 15

# Időzóna: a lábléc "Utoljára frissítve" időpontja (a build ideje) magyar idő szerint jelenjen meg
timezone: Europe/Budapest

# Menü a fejlécben. Egy pont lehet sima link (title + url),
# vagy lenyíló csoport (title + items).
# A Jelentkezés gomb nem itt van, azt a menüsor végére a layout teszi ki.
nav:
  - title: A műhelyről
    items:
      - title: A műhelyről röviden
        url: /a_muhelyrol/
      - title: Résztvevői útmutató
        url: /resztvevoi-utmutato/
      - title: Projektötletek jelentkezéshez
        url: /otletek/
      - title: Mentorok
        url: /mentorok/
  - title: Korábbi évek
    items:
      - title: Csapatok
        url: /csapatok/
      - title: Beszámolók
        url: /beszamolok/
      - title: Galéria
        url: /galeria/

# Beszámolók: minden írás egy fájl a _beszamolok mappában
collections:
  beszamolok:
    output: true
    permalink: /beszamolok/:name/

defaults:
  - scope:
      path: ""
      type: beszamolok
    values:
      layout: article
